version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /the-syndicate
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript < 6.1; move to 7 only when it does.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Types track the Node major we run (24), not the newest Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # react and react-dom must always move together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      dev-dependencies:
        dependency-type: development
        exclude-patterns: ['@types/react', '@types/react-dom']
